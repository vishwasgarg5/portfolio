name: Analyze V6 evidence

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "predictions/strategy_backtest.csv"
      - "scripts/v6_evidence_analysis.py"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: pip install pandas
      - name: Run V6 evidence analysis
        run: python scripts/v6_evidence_analysis.py
      - name: Commit analysis
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions/v6_evidence_analysis.md
          git diff --cached --quiet || git commit -m "chore: update V6 evidence analysis"
          git push
