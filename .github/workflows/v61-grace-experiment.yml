name: V6.1 grace-period experiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V6.1 experiment
        run: python scripts/v61_grace_experiment.py
      - name: Validate experiment
        run: |
          python - <<'PY'
          import pandas as pd
          p="predictions/v61_grace_experiment.csv"
          df=pd.read_csv(p)
          plans=df[df.decision.eq("plan")]
          if len(plans)==0: raise SystemExit("No experiment plans")
          if set(plans.grace_days.dropna().astype(int)) != {3,5,7}: raise SystemExit("Missing grace periods")
          if plans.exit_type.eq("error").any(): raise SystemExit("Invalid experiment")
          print(plans.groupby("grace_days").size())
          PY
      - name: Commit experiment
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions/v61_grace_experiment.csv predictions/v61_grace_experiment.md
          git diff --cached --quiet || git commit -m "chore: record V6.1 grace experiment"
          git push
