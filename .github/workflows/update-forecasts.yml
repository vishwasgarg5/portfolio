name: Update portfolio forecasts

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
  schedule:
    # 08:30 IST (03:00 UTC), Monday-Friday, before the NSE session.
    - cron: "0 3 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data, forecasts and portfolio report
        run: python scripts/update_forecasts.py

      - name: Commit data, predictions and report
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.csv predictions/*.csv predictions/*.md
          git diff --cached --quiet || git commit -m "chore: update portfolio forecasts and report"
          git push

      - name: Send Telegram portfolio report
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py

      - name: Send Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN"); chat=os.environ.get("TELEGRAM_CHAT_ID")
          if token and chat:
              data=urllib.parse.urlencode({"chat_id":chat,"text":"⚠️ <b>PORTFOLIO WORKFLOW FAILED</b>\nCheck the latest GitHub Actions run for the failed step.","parse_mode":"HTML"}).encode()
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=data,method="POST"),timeout=30).read()
          else:
              print("Telegram failure alert skipped: missing secrets")
          PY
