name: Update portfolio forecasts

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-forecasts.yml"
  schedule:
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Check stored prediction data
        id: stored
        shell: bash
        run: |
          if [ -s predictions/portfolio_report.csv ] && [ -s predictions/latest.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Stored prediction/report data found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Stored prediction/report data not found."
          fi

      - name: Run model tests
        if: github.event_name != 'workflow_dispatch' || steps.stored.outputs.available != 'true'
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Update data, forecasts and portfolio report
        if: github.event_name != 'workflow_dispatch' || steps.stored.outputs.available != 'true'
        run: python scripts/update_forecasts.py

      - name: Run V6 historical strategy backtest
        run: python -m src.strategy_backtest

      - name: Build V6 historical strategy backtest report
        run: python scripts/strategy_backtest_report.py

      - name: Validate V6 evidence
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("predictions/strategy_backtest.csv")
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit("V6 evidence file missing")
          df=pd.read_csv(p)
          if len(df) == 0:
              raise SystemExit("V6 produced zero backtest rows")
          if "version" not in df.columns or not df["version"].eq("V6").all():
              raise SystemExit("Backtest contains non-V6 rows")
          errors=df["decision"].astype(str).str.startswith("error:").sum()
          if errors:
              raise SystemExit(f"V6 has {errors} error rows")
          print(f"V6 evidence rows: {len(df)}")
          print(f"V6 plans: {(df['decision']=='plan').sum()}")
          print(f"V6 trend blocks: {(df['decision']=='trend_blocked').sum()}")
          PY

      - name: Commit data, predictions and report
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.csv predictions/*.csv predictions/*.md
          git diff --cached --quiet || git commit -m "chore: update portfolio forecasts and report"
          git push

      - name: Send Telegram portfolio report
        id: telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py

      - name: Send Telegram delivery alert
        if: steps.telegram.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          chat=os.environ.get("TELEGRAM_CHAT_ID")
          if token and chat:
              data=urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": "⚠️ <b>TELEGRAM DELIVERY FAILED</b>\nForecast/report data completed successfully. Check the Telegram step in GitHub Actions.",
                  "parse_mode": "HTML",
              }).encode()
              urllib.request.urlopen(
                  urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=data,
                      method="POST",
                  ),
                  timeout=30,
              ).read()
          else:
              print("Telegram delivery alert skipped: missing secrets")
          PY

      - name: Send workflow failure alert
        if: failure() && steps.telegram.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          chat=os.environ.get("TELEGRAM_CHAT_ID")
          if token and chat:
              data=urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": "⚠️ <b>PORTFOLIO WORKFLOW FAILED</b>\nCheck the latest GitHub Actions run for the failed step.",
                  "parse_mode": "HTML",
              }).encode()
              urllib.request.urlopen(
                  urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=data,
                      method="POST",
                  ),
                  timeout=30,
              ).read()
          else:
              print("Workflow failure alert skipped: missing secrets")
          PY
