name: Update portfolio forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data, forecasts and portfolio report
        run: python scripts/update_forecasts.py

      - name: Commit data, predictions and report
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.csv predictions/*.csv predictions/*.md
          git diff --cached --quiet || git commit -m "chore: update portfolio forecasts and report"
          git push
      - name: Send Telegram portfolio report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py
