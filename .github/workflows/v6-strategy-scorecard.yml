name: V6 strategy scorecard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V6 scorecard
        run: python scripts/v6_strategy_scorecard.py
      - name: Validate scorecard
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("predictions/v6_strategy_scorecard.csv")
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit("Scorecard missing")
          df=pd.read_csv(p)
          if "ALL" not in set(df["scope"]):
              raise SystemExit("ALL row missing")
          if len(df) < 2:
              raise SystemExit("Insufficient scorecard rows")
          print(f"Scorecard rows: {len(df)}")
          PY
      - name: Commit scorecard
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions/v6_strategy_scorecard.csv predictions/v6_strategy_scorecard.md
          git diff --cached --quiet || git commit -m "feat: record V6 strategy scorecard"
          git push
