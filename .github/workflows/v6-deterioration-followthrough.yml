name: V6 deterioration follow-through analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run follow-through analysis
        run: python scripts/v6_deterioration_followthrough.py
      - name: Validate analysis
        run: |
          python - <<'PY'
          import pandas as pd
          p="predictions/v6_deterioration_followthrough.csv"
          df=pd.read_csv(p)
          if len(df) == 0: raise SystemExit("No deterioration exits analysed")
          required={"symbol","exit_date","partial_profit_percent","max_close_return_60d","max_high_return_60d"}
          missing=required-set(df.columns)
          if missing: raise SystemExit(f"Missing columns: {sorted(missing)}")
          print(f"Analysed deterioration exits: {len(df)}")
          PY
      - name: Commit analysis
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions/v6_deterioration_followthrough.csv predictions/v6_deterioration_followthrough.md
          git diff --cached --quiet || git commit -m "chore: record V6 deterioration follow-through"
          git push
