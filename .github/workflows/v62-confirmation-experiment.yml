name: V6.2 deterioration confirmation experiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V6.2 experiment
        run: python scripts/v62_confirmation_experiment.py
      - name: Validate experiment
        run: |
          python - <<'PY'
          import pandas as pd
          p="predictions/v62_confirmation_experiment.csv"
          df=pd.read_csv(p)
          plans=df[df.decision.eq("plan")]
          if len(plans)==0: raise SystemExit("No experiment plans")
          if set(plans.variant.dropna()) != {"V6_control","V6.2_confirmed"}:
              raise SystemExit("Missing experiment variants")
          errors=df.decision.astype(str).str.startswith("error:")
          if errors.any(): raise SystemExit(f"Experiment errors: {errors.sum()}")
          print(plans.groupby("variant").size())
          print(plans.groupby(["variant","exit_type"]).size())
          PY
      - name: Commit experiment
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions/v62_confirmation_experiment.csv predictions/v62_confirmation_experiment.md
          git diff --cached --quiet || git commit -m "chore: record V6.2 confirmation experiment"
          git push
